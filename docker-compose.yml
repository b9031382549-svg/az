services:
  app:
    build:
      context: ./docker/app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: az_app
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    # WSL2's container resolver hangs on AAAA lookups; use public upstreams and
    # skip IPv6 queries so curl/composer connect without a ~10s DNS timeout.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - "no-aaaa"
    volumes:
      - ./:/var/www/html
    ports:
      # Host port 100 → app. Open at http://az.test:100 (hosts: 127.0.0.1 az.test).
      - "100:8000"
    depends_on:
      pgsql:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
    command: php artisan serve --host=0.0.0.0 --port=8000
    tty: true
    restart: unless-stopped

  # Queue worker — runs background jobs (e.g. catalog embedding) and survives
  # restarts. On prod: keep this running and dispatch work with
  # `php artisan data:embed-catalog --queue`.
  worker:
    image: az_app
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - "no-aaaa"
    volumes:
      - ./:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
    command: php artisan horizon
    restart: unless-stopped

  pgsql:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Non-default host port so another Postgres can keep 5432. The app talks to
      # pgsql over the internal docker network, not this published port.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      # Non-default host port so another Ollama can keep 11434 (app uses the
      # internal network).
      - "11500:11434"
    # The same serving settings as prod (docker-compose.prod.yml).
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "3"
    restart: unless-stopped

  # Sorter — the same image, model files and settings as prod (docker-compose.prod.yml); the
  # model dir is local (research-data/sorter-model/v1, not in git — the same sha256 as prod's
  # /opt/az-assets/sorter). The host port is only for poking it from host tools.
  sorter:
    build:
      context: ./docker/sorter
    image: az_sorter
    volumes:
      - ${SORTER_MODEL_DIR:-./research-data/sorter-model/v1}:/models/sorter:ro
    environment:
      SORTER_THREADS: "2"
    mem_limit: 1536m
    ports:
      - "127.0.0.1:8510:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status != 200)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped


  # Redis — queue backend for Horizon (dev). AOF on for parity with prod.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis:/data
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  redis:
